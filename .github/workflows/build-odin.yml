name: Build odin BakaSU+SUSFS230 (orig config)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: 1. Checkout sukisu
        uses: actions/checkout@v4
        with:
          repository: Inkypen79/kernel_xiaomi_odin
          ref: sukisu
          fetch-depth: 1

      - name: 1.5 Fetch original kernel config
        run: |
          set -e
          URL="https://raw.githubusercontent.com/LTG6933/kernel_xiaomi_odin/lineage-24.0/odin_orig.config.gz"
          curl -fsSL "$URL" -o /tmp/orig.config.gz
          echo "gz size: $(wc -c < /tmp/orig.config.gz)"
          gunzip -c /tmp/orig.config.gz > /tmp/orig.config
          echo "config lines: $(wc -l < /tmp/orig.config)"
          grep -m1 CONFIG_LOCALVERSION /tmp/orig.config
          grep -c "^CONFIG_.*=y" /tmp/orig.config | xargs echo "enabled options:"

      - name: 2. Toolchain
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y clang-18 lld-18 llvm-18 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi bc bison flex libssl-dev libelf-dev python3 zip unzip cpio xz-utils git curl
          clang-18 --version

      - name: 2.5 Upgrade SUSFS to v2.3.0
        run: |
          set -e
          SRC=https://raw.githubusercontent.com/yapixel/susfs4ksu/main/kernel_patches
          curl -fsSL "$SRC/fs/susfs.c" -o fs/susfs.c
          curl -fsSL "$SRC/include/linux/susfs.h" -o include/linux/susfs.h
          curl -fsSL "$SRC/include/linux/susfs_def.h" -o include/linux/susfs_def.h
          grep -m1 SUSFS_VERSION include/linux/susfs.h
          if ! grep -q "CMD_SUSFS_SET_SUS_PATH_UID_FILTER" include/linux/susfs_def.h; then
            printf '\n#define CMD_SUSFS_SET_SUS_PATH_UID_FILTER 0x55554\n' >> include/linux/susfs_def.h
          fi
          echo ">>> SUSFS 2.3.0 ready"

      - name: 2.6 Compatibility layer
        run: |
          set -e
          echo '' | base64 -d > fs/susfs_compat.c
          echo "compat lines: $(wc -l < fs/susfs_compat.c)"
          grep -q "susfs_compat.o" fs/Makefile || echo 'obj-$(CONFIG_KSU_SUSFS) += susfs_compat.o' >> fs/Makefile
          grep -n "susfs" fs/Makefile
          echo ">>> compat ready"

      - name: 2.7 Rewire SUS_KSTAT callsites
        run: |
          set -e
          sed -i 's|extern void susfs_sus_ino_for_generic_fillattr(unsigned long ino, struct kstat \*stat);|extern void susfs_sus_kstat_spoof_generic_fillattr(struct inode *inode, struct kstat *stat, u32 result_mask);|' fs/stat.c
          sed -i 's|susfs_sus_ino_for_generic_fillattr(inode->i_ino, stat);|susfs_sus_kstat_spoof_generic_fillattr(inode, stat, STATX_SUS_KSTAT);|' fs/stat.c
          grep -n "susfs_sus_kstat_spoof_generic_fillattr" fs/stat.c
          sed -i 's|extern void susfs_sus_ino_for_show_map_vma(unsigned long ino, dev_t \*out_dev, unsigned long \*out_ino);|extern void susfs_sus_kstat_spoof_show_map_vma(struct inode *inode, dev_t *out_dev, unsigned long *out_ino);|' fs/proc/task_mmu.c
          sed -i 's|susfs_sus_ino_for_show_map_vma(inode->i_ino, &dev, &ino);|susfs_sus_kstat_spoof_show_map_vma(inode, \&dev, \&ino);|' fs/proc/task_mmu.c
          grep -n "susfs_sus_kstat_spoof_show_map_vma" fs/proc/task_mmu.c
          echo ">>> rewired"

      - name: 3. Integrate BakaSU
        run: |
          set -e
          rm -rf KernelSU
          git clone --depth=1 https://github.com/Baka-SU/BakaSU.git KernelSU
          rm -f drivers/kernelsu
          ln -sfn ../KernelSU/kernel drivers/kernelsu
          ls -la drivers/kernelsu
          test -f drivers/kernelsu/Kconfig
          grep -q "kernelsu" drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'drivers/kernelsu/Kconfig' drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          echo ">>> integrated"

      - name: 3.5 Neutralize legacy hooks
        run: |
          set -e
          sed -i 's/ksu_init_rc_hook/susfs_compat_init_rc/g' fs/read_write.c fs/stat.c
          sed -i 's/ksu_input_hook/susfs_compat_input/g' drivers/input/input.c
          sed -i 's/ksu_execveat_hook/susfs_compat_execveat/g' fs/exec.c
          sed -i 's/^extern bool susfs_compat_/static bool susfs_compat_/' fs/read_write.c fs/stat.c drivers/input/input.c fs/exec.c
          sed -i 's/^static bool susfs_compat_\([a-z_]*\) __read_mostly;/static bool susfs_compat_\1 __read_mostly = true;/' fs/read_write.c fs/stat.c drivers/input/input.c fs/exec.c
          if grep -qw "ksu_init_rc_hook" fs/read_write.c; then echo "STILL LEGACY"; exit 1; fi
          echo ">>> neutralized"

      - name: 3.6 Align avc static_key
        run: |
          set -e
          sed -i 's/^bool susfs_is_avc_log_spoofing_enabled = false;$/extern struct static_key_false susfs_is_avc_log_spoofing_enabled;/' security/selinux/avc.c
          sed -i 's/READ_ONCE(susfs_is_avc_log_spoofing_enabled)/static_branch_unlikely(\&susfs_is_avc_log_spoofing_enabled)/g' security/selinux/avc.c
          grep -q "jump_label.h" security/selinux/avc.c || sed -i 's|#include <linux/avc.h>|#include <linux/avc.h>\n#include <linux/jump_label.h>|' security/selinux/avc.c
          grep -n "susfs_is_avc_log_spoofing_enabled" security/selinux/avc.c
          echo ">>> avc aligned"

      - name: 4. Build with ORIGINAL config
        run: |
          set -eo pipefail
          export ARCH=arm64
          export CC=clang-18
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH=/usr/lib/llvm-18/bin:$PATH
          echo "###### 4.1 base defconfig ######"
          make O=out odin_defconfig < /dev/null
          echo "###### 4.2 overwrite with ORIGINAL config ######"
          CFG=./scripts/config
          F=out/.config
          cp /tmp/orig.config $F
          echo "lines after copy: $(wc -l < $F)"
          echo "###### 4.3 adjust ######"
          $CFG --file $F --disable KSU_TRACEPOINT_HOOK
          $CFG --file $F --disable KSU_MANUAL_HOOK
          $CFG --file $F --enable KSU_SUSFS
          $CFG --file $F --disable LTO_CLANG
          $CFG --file $F --enable LTO_NONE
          $CFG --file $F --disable LOCALVERSION_AUTO
          $CFG --file $F --set-str LOCALVERSION "-qgki-odin-QiuChenly"
          $CFG --file $F --disable MODULE_SIG
          $CFG --file $F --disable MODULE_SIG_FORCE
          $CFG --file $F --disable MODULE_SIG_ALL
          echo "###### 4.4 olddefconfig ######"
          make O=out olddefconfig < /dev/null
          echo "###### 4.5 verify ######"
          grep -E "^CONFIG_LOCALVERSION|^CONFIG_KSU=|^CONFIG_KSU_SUSFS|^CONFIG_LTO" $F || true
          grep -q "^CONFIG_KSU=y" $F || { echo "FAIL KSU"; exit 1; }
          grep -q "^CONFIG_KSU_SUSFS=y" $F || { echo "FAIL SUSFS"; exit 1; }
          echo ">>> config OK"
          echo "###### 4.6 build ######"
          make O=out -j$(nproc) Image < /dev/null 2>&1 | tee build.log
          echo "###### 4.7 result ######"
          ls -la out/arch/arm64/boot/
          echo "IMAGE SIZE: $(stat -c %s out/arch/arm64/boot/Image)"
          echo "原版参考: 40321536"

      - name: 5. Diagnose
        if: always()
        run: |
          echo "##### Image #####"
          find out -name "Image*" -type f 2>/dev/null | head || true
          echo "##### size compare #####"
          IMG=out/arch/arm64/boot/Image
          if [ -f $IMG ]; then
            SZ=$(stat -c %s $IMG)
            echo "built: $SZ"
            echo "orig : 40321536"
            echo "diff : $((40321536 - SZ))"
          fi
          echo "##### version #####"
          strings $IMG 2>/dev/null | grep -m1 "Linux version 5.4" || true
          echo "##### errors #####"
          grep -nE "error:|Error [0-9]|undefined reference|multiple definition|You lost|can't open|fatal" build.log 2>/dev/null | head -40 || echo "(none)"
          echo "##### tail #####"
          tail -25 build.log 2>/dev/null || true

      - name: 6. Package
        if: success()
        run: |
          set -e
          cp out/arch/arm64/boot/Image ./Image-odin
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git /tmp/AK3
          cd /tmp/AK3
          rm -rf .git
          sed -i 's/^kernel.string=.*/kernel.string=odin orig-config/' anykernel.sh
          sed -i 's/^device.name1=.*/device.name1=odin/' anykernel.sh
          sed -i 's/^device.name2=.*/device.name2=MIX4/' anykernel.sh
          cp $GITHUB_WORKSPACE/Image-odin ./Image
          zip -r9 $GITHUB_WORKSPACE/odin-kernel-origcfg.zip *
          cd $GITHUB_WORKSPACE
          ls -la Image-odin odin-kernel-origcfg.zip

      - name: 7. Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: odin-kernel-origcfg
          path: |
            Image-odin
            odin-kernel-origcfg.zip
            build.log
