name: Build odin BakaSU+SUSFS240

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: 1. Checkout resukisu
        uses: actions/checkout@v4
        with:
          repository: Inkypen79/kernel_xiaomi_odin
          ref: resukisu
          fetch-depth: 1

      - name: 2. Toolchain
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y clang-18 lld-18 llvm-18 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi bc bison flex libssl-dev libelf-dev python3 zip unzip cpio xz-utils git curl
          clang-18 --version

      - name: 2.5 Upgrade SUSFS to v2.4.0
        run: |
          set -e
          SRC=https://raw.githubusercontent.com/shadichy/susfs4ksu/master/kernel_patches

          echo "=== 备份 2.1.0 ==="
          cp fs/susfs.c fs/susfs.c.210
          cp include/linux/susfs.h include/linux/susfs.h.210
          [ -f include/linux/susfs_def.h ] && cp include/linux/susfs_def.h include/linux/susfs_def.h.210 || true

          echo "=== 下载 2.4.0 ==="
          curl -fsSL "$SRC/fs/susfs.c" -o fs/susfs.c
          curl -fsSL "$SRC/include/linux/susfs.h" -o include/linux/susfs.h
          curl -fsSL "$SRC/include/linux/susfs_def.h" -o include/linux/susfs_def.h || echo "(2.4.0 无独立 susfs_def.h，使用 2.1.0 的)"

          echo "=== 版本确认 ==="
          grep -m1 "SUSFS_VERSION" include/linux/susfs.h || echo "WARN: 无版本宏"
          ls -la fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h

      - name: 3. Integrate BakaSU
        run: |
          set -e
          git clone --depth=1 https://github.com/Baka-SU/BakaSU.git /tmp/BakaSU
          sh /tmp/BakaSU/kernel/setup.sh
          ls -la drivers/kernelsu

      - name: 3.5 Fix hooks
        run: |
          set -e
          # resukisu 的 stat.c 只有 ksu_handle_fstat，BakaSU 要 vfs_fstat
          grep -n "ksu_handle_fstat" fs/stat.c || true
          sed -i 's/\bksu_handle_fstat\b/ksu_handle_vfs_fstat/g' fs/stat.c
          grep -n "ksu_handle_vfs_fstat" fs/stat.c || { echo "FAIL: stat hook"; exit 1; }

          # 旧 hook 清理
          for f in fs/read_write.c fs/stat.c drivers/input/input.c fs/exec.c; do
            sed -i 's/\bksu_init_rc_hook\b/susfs_compat_init_rc/g; s/\bksu_input_hook\b/susfs_compat_input/g; s/\bksu_execveat_hook\b/susfs_compat_execveat/g' $f
          done
                    sed -i 's/^extern bool susfs_compat_\([a-z_]*\) __read_mostly;/static bool susfs_compat_\1 __read_mostly = true;/' fs/read_write.c fs/stat.c drivers/input/input.c fs/exec.c
          echo ">>> hooks fixed"

      - name: 4. Build
        run: |
          set -eo pipefail
          export ARCH=arm64 CC=clang-18 CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH=/usr/lib/llvm-18/bin:$PATH

          make O=out odin_defconfig < /dev/null
          CFG=./scripts/config; F=out/.config

          $CFG --file $F --enable KSU
          $CFG --file $F --disable KSU_TRACEPOINT_HOOK
          $CFG --file $F --disable KSU_MANUAL_HOOK
          $CFG --file $F --enable  KSU_SUSFS
          for o in SUS_PATH SUS_MOUNT SUS_KSTAT SPOOF_UNAME HIDE_KSU_SUSFS_SYMBOLS SPOOF_CMDLINE_OR_BOOTCONFIG SUS_MAP; do
            $CFG --file $F --enable KSU_SUSFS_$o
          done
          $CFG --file $F --disable KSU_SUSFS_OPEN_REDIRECT
          $CFG --file $F --disable KSU_SUSFS_ENABLE_LOG
          $CFG --file $F --disable LOCALVERSION_AUTO
          $CFG --file $F --set-str LOCALVERSION "-qgki-odin-QiuChenly"
          $CFG --file $F --disable LTO_CLANG
          $CFG --file $F --disable MODULE_SIG
          $CFG --file $F --disable MODULE_SIG_FORCE
          $CFG --file $F --disable MODULE_SIG_ALL

          make O=out olddefconfig < /dev/null
          grep -E "^CONFIG_KSU|SUSFS|^CONFIG_LOCALVERSION" $F || true
          grep -q "^CONFIG_KSU_SUSFS=y" $F || { echo "FAIL SUSFS"; exit 1; }

          make O=out -j$(nproc) Image < /dev/null 2>&1 | tee build.log
          ls -la out/arch/arm64/boot/

      - name: 5. Diagnose
        if: always()
        run: |
          find out -name "Image*" -type f 2>/dev/null | head || true
          find out -name "susfs*.o" 2>/dev/null | head || true
          grep -nE "error:|Error [0-9]|undefined reference|You lost|fatal" build.log 2>/dev/null | head -50 || echo "(none)"
          tail -30 build.log 2>/dev/null || true
