name: Build odin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: 1. Checkout ksu-next
        uses: actions/checkout@v4
        with:
          repository: Inkypen79/kernel_xiaomi_odin
          ref: ksu-next
          fetch-depth: 1
          submodules: recursive

      - name: 1.5 Ensure KernelSU-Next
        run: |
          set -e
          if [ ! -d KernelSU-Next/kernel ]; then
            echo ">>> cloning KernelSU-Next"
            rm -rf KernelSU-Next
            git clone --depth=1 https://github.com/rifsxd/KernelSU-Next.git KernelSU-Next
          fi
          ls KernelSU-Next/kernel/ | head -5
          ls -la drivers/kernelsu
          if [ ! -e drivers/kernelsu ]; then
            ln -sfn ../KernelSU-Next/kernel drivers/kernelsu
          fi

      - name: 2. Toolchain
        run: |
          set -e
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y clang-18 lld-18 llvm-18 gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu gcc-arm-linux-gnueabi bc bison flex libssl-dev libelf-dev python3 zip unzip cpio xz-utils git
          clang-18 --version

      - name: 3. Build
        run: |
          set -eo pipefail

          export ARCH=arm64
          export CC=clang-18
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export PATH=/usr/lib/llvm-18/bin:$PATH

          echo "###### 3.1 verify KSU ######"
          ls -la drivers/kernelsu
          tail -3 drivers/Kconfig

          echo "###### 3.2 defconfig ######"
          make O=out odin_defconfig < /dev/null
          wc -l out/.config

          echo "###### 3.3 patch config ######"
          CFG=./scripts/config
          F=out/.config
          $CFG --file $F --enable KSU
          $CFG --file $F --disable LOCALVERSION_AUTO
          $CFG --file $F --set-str LOCALVERSION "-qgki-odin-QiuChenly"
          $CFG --file $F --disable MODULE_SIG
          $CFG --file $F --disable MODULE_SIG_FORCE
          $CFG --file $F --disable MODULE_SIG_ALL

          echo "###### 3.4 olddefconfig (no yes, no pipe) ######"
          make O=out olddefconfig < /dev/null

          echo "###### 3.5 verify config ######"
          grep -E "^CONFIG_KSU|^CONFIG_LOCALVERSION|^CONFIG_MODULE_SIG" $F || true
          grep -q "^CONFIG_KSU=y" $F || { echo "KSU NOT ENABLED"; exit 1; }

          echo "###### 3.6 build Image ######"
          make O=out -j$(nproc) Image < /dev/null 2>&1 | tee build.log

          echo "###### 3.7 result ######"
                    ls -la out/arch/arm64/boot/

      - name: 4. Diagnose
        if: always()
        run: |
          echo "##### find Image #####"
          find out -name "Image*" -type f 2>/dev/null | head || true
          echo "##### errors #####"
          grep -nE "error:|Error in reading|No rule to make|undefined reference" build.log 2>/dev/null | head -40 || echo "(none)"
          echo "##### tail #####"
          tail -30 build.log 2>/dev/null || true

      - name: 5. Package
        if: success()
        run: |
          set -e
          cp out/arch/arm64/boot/Image ./Image-odin
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git /tmp/AK3
          cd /tmp/AK3
          rm -rf .git
          sed -i 's/^kernel.string=.*/kernel.string=KSU odin/' anykernel.sh
          sed -i 's/^device.name1=.*/device.name1=odin/' anykernel.sh
          sed -i 's/^device.name2=.*/device.name2=MIX4/' anykernel.sh
          cp $GITHUB_WORKSPACE/Image-odin ./Image
          zip -r9 $GITHUB_WORKSPACE/odin-AnyKernel3.zip *
          cd $GITHUB_WORKSPACE
          ls -la Image-odin odin-AnyKernel3.zip

      - name: 6. Upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: odin-ksu
          path: |
            Image-odin
            odin-AnyKernel3.zip
            build.log
