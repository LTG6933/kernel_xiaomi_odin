name: Build odin 5.4.281 BakaSU+SUSFS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: 1. Pull Xiaomi HyperOS 5.4.281 kernel with SUSFS
        run: |
          set -e
          git clone --depth=1 -b main https://github.com/liqidecg/xiaomi_kernel_odin.git kernel
          cd kernel
          head -4 Makefile | tr '\n' ' '; echo
          grep -m2 "SUSFS_VERSION" include/linux/susfs.h || true
          ls -la fs/susfs.c

      - name: 1.5 Upgrade 5.4.281 -> 5.4.302 (kernel.org stable patches)
        run: |
          set -e
          cd $GITHUB_WORKSPACE/kernel
          echo "=== 升级前 ==="
          head -4 Makefile | tr '\n' ' '; echo
          OK=0; FAIL=0
          for v in $(seq 282 302); do
            prev=$((v-1))
            url="https://cdn.kernel.org/pub/linux/kernel/v5.x/incr/patch-5.4.${prev}-${v}.xz"
            if curl -sSL --max-time 60 "$url" -o /tmp/p.xz 2>/dev/null && [ -s /tmp/p.xz ]; then
              if xz -dc /tmp/p.xz 2>/dev/null | patch -p1 --forward --no-backup-if-mismatch --reject-file=- > /tmp/patch_out.txt 2>&1; then
                OK=$((OK+1))
              else
                # 有冲突但部分应用也算前进
                if grep -q "^patching file" /tmp/patch_out.txt 2>/dev/null; then
                  OK=$((OK+1))
                else
                  FAIL=$((FAIL+1))
                  echo "  [FAIL] 5.4.${prev} -> ${v}"
                fi
              fi
            else
              FAIL=$((FAIL+1))
              echo "  [SKIP] 5.4.${prev}-${v} 下载失败"
            fi
          done
          echo "=== 升级结果: 成功 $OK 个, 失败 $FAIL 个 ==="
          head -4 Makefile | tr '\n' ' '; echo
          echo "=== 版本号确认 ==="
          grep -E "^VERSION|^PATCHLEVEL|^SUBLEVEL" Makefile
          echo "=== 清理 .rej/.orig ==="
          find . -name "*.rej" -delete 2>/dev/null || true
          find . -name "*.orig" -delete 2>/dev/null || true

      - name: 2. Pull KSU driver from MrNya907
        run: |
          set -e
          git clone --depth=1 -b master https://github.com/MrNya907/xiaomi_kernel_odin.git ksusr
          test -f ksusr/drivers/kernelsu/Kconfig || { echo "FAIL no Kconfig"; exit 1; }
          echo ">>> KSU driver OK"

      - name: 3. Toolchain
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu device-tree-compiler python3 zip lz4 zstd git curl rsync clang lld llvm
          clang --version | head -1
          aarch64-linux-gnu-gcc --version | head -1

      - name: 4. Integrate BakaSU via symlink
        run: |
          set -e
          cd $GITHUB_WORKSPACE
          rm -rf kernel/drivers/kernelsu kernel/KernelSU bakasu
          git clone https://github.com/Baka-SU/BakaSU.git bakasu
          cd bakasu
          echo "BakaSU HEAD: $(git log -1 --format='%h %s')"
          CNT=$(git rev-list --count HEAD)
          echo "BakaSU version code = $((30000 + CNT + 700))"
          cd ..
          mv bakasu kernel/KernelSU
          ln -sfn ../KernelSU/kernel kernel/drivers/kernelsu
          ls -la kernel/drivers/kernelsu
          test -f kernel/drivers/kernelsu/Kconfig || { echo "FAIL Kconfig"; exit 1; }
          test -e kernel/KernelSU/.git || { echo "FAIL .git missing"; exit 1; }
          echo ">>> .git OK"
          grep -q 'drivers/kernelsu/Kconfig' kernel/drivers/Kconfig || sed -i '/^endmenu/i source "drivers/kernelsu/Kconfig"' kernel/drivers/Kconfig
          grep -n 'drivers/kernelsu/Kconfig' kernel/drivers/Kconfig
          grep -q 'kernelsu' kernel/drivers/Makefile || printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> kernel/drivers/Makefile
          grep -n 'kernelsu' kernel/drivers/Makefile

      - name: 5. 5.4 compat fixes
        run: |
          set -e
          cd $GITHUB_WORKSPACE/kernel
          DRV=drivers/kernelsu

          echo "=== 5.0 诊断：删除 techpack（验证是否是它导致启动失败）==="
          if [ -d techpack ]; then
            du -sh techpack 2>/dev/null || true
            rm -rf techpack
            echo "  techpack 已删除"
          fi
          sed -i 's|^obj-y += techpack/|# obj-y += techpack/  # DIAG: disabled|' Makefile
          sed -i 's|^obj-\$(CONFIG_ARCH_QCOM) += techpack/|# obj-$(CONFIG_ARCH_QCOM) += techpack/|' Makefile
          grep -n "techpack" Makefile | head -5 || echo "  Makefile 已无 techpack 引用"

          echo "=== 5.0b 修 5.4.302 补丁产生的错误 ==="
          # 1) ARM64_WORKAROUND_SPECULATIVE_SSBS（cpucaps.h 是 #define，不是枚举）
          CCH=arch/arm64/include/asm/cpucaps.h
          if [ -f "$CCH" ] && ! grep -q "ARM64_WORKAROUND_SPECULATIVE_SSBS" "$CCH"; then
            sed -i 's|^#define ARM64_NCAPS\b|#define ARM64_WORKAROUND_SPECULATIVE_SSBS\t51\n#define ARM64_NCAPS|' "$CCH"
            echo "  插入结果:"
            grep -n "SPECULATIVE_SSBS\|ARM64_NCAPS" "$CCH"
          else
            echo "  SSBS 已存在或文件缺失"
          fi
          # 2) oom_kill.c: 补丁用了 cred 但没声明，在 oom_group 后加
          OK2=mm/oom_kill.c
          if [ -f "$OK2" ] && ! grep -q "struct cred \*cred;" "$OK2"; then
            sed -i 's|^\tstruct mem_cgroup \*oom_group;$|\tstruct mem_cgroup *oom_group;\n\tstruct cred *cred;|' "$OK2"
          fi
          echo "  cred 声明检查:"
          grep -n "struct cred \*cred;" "$OK2" | head -3 || echo "  WARN 未插入"

          # 3) fair.c: static 冲突（去掉 static）
          SF=kernel/sched/fair.c
          if [ -f "$SF" ]; then
            sed -i 's|^static int sched_balance_newidle(|int sched_balance_newidle(|' "$SF"
            sed -i 's|^static void sched_balance_newidle(|void sched_balance_newidle(|' "$SF"
          fi
          echo "  fair.c newidle 检查:"
          grep -n "sched_balance_newidle" "$SF" 2>/dev/null | head -5 || echo "  (无)"
          echo "  诊断信息已输出"

          echo "=== 5.1 pgtable ==="
          for f in $(grep -rln 'linux/pgtable.h' $DRV 2>/dev/null); do
            sed -i 's|#include <linux/pgtable.h>|#include <asm/pgtable.h>|' "$f"
            echo "  fixed: $f"
          done

          echo "=== 5.2 compat header ==="
          echo "" | base64 -d > $DRV/ku_compat54.h
          head -3 $DRV/ku_compat54.h
          for kf in $DRV/Kbuild $DRV/Makefile; do
            if [ -f "$kf" ] && ! grep -q ku_compat54.h "$kf"; then
              printf 'ccflags-y += -include $(srctree)/%s/ku_compat54.h\n' "$DRV" >> "$kf"
              echo "  compat -> $kf"
            fi
          done

          echo "=== 5.3 relax -Werror ==="
          sed -i 's/-Werror/-Wno-error/g' $DRV/Kbuild 2>/dev/null || true

          echo "=== 5.4 fix lz4p asm.h __has_feature ==="
          LZ=drivers/block/zram/lz4p/asm.h
          if [ -f "$LZ" ] && ! grep -q "__has_feature(x) 0" "$LZ"; then
            printf '#ifndef __has_feature\n#define __has_feature(x) 0\n#endif\n' | cat - "$LZ" > "$LZ.tmp" && mv "$LZ.tmp" "$LZ"
            echo "  lz4p patched"
          fi

          echo "=== 5.5 fix broken techpack headers ==="
          CNT=0
          for f in $(find techpack -name '*.h' -size -400c 2>/dev/null); do
            c=$(cat "$f" 2>/dev/null | tr -d '\r\n')
            case "$c" in
              *'/'*.h)
                t="$(dirname "$f")/$c"
                if [ -f "$t" ]; then cp -f "$t" "$f"; CNT=$((CNT+1)); fi
                ;;
            esac
          done
          echo "  fixed $CNT headers"

          echo "=== 5.54 remove GCC-only warning options (clang 不认) ==="
          for mf in Makefile scripts/Makefile.* ; do
            if [ -f "$mf" ]; then
              sed -i 's/ -Werror=maybe-uninitialized//g; s/-Werror=maybe-uninitialized//g' "$mf"
            fi
          done
          echo "  检查残留:"
          grep -rn "Werror=maybe-uninitialized" Makefile scripts/ 2>/dev/null | head -3 || echo "  (cleared)"
          echo "=== 5.55 fix fake_state -> selinux_state ==="
          grep -rn "fake_state" security/selinux/ 2>/dev/null | head -5 || echo "  no fake_state"
          sed -i 's|\bfake_state\b|selinux_state|g' security/selinux/selinuxfs.c security/selinux/hooks.c 2>/dev/null || true
          echo "  after fix:"
          grep -rn "fake_state" security/selinux/ 2>/dev/null | head -3 || echo "  (cleared)"

          echo "=== 5.6 CMD macros ==="
          printf '\n#ifndef CMD_SUSFS_SET_SUS_PATH_UID_FILTER\n#define CMD_SUSFS_SET_SUS_PATH_UID_FILTER 0x55554\n#endif\n' >> include/linux/susfs.h
          printf '\n#ifndef CMD_SUSFS_SET_PRIORITY_UID_FILTER\n#define CMD_SUSFS_SET_PRIORITY_UID_FILTER 0x60030\n#endif\n' >> include/linux/susfs.h
          grep -n "SUS_PATH_UID_FILTER\|PRIORITY_UID_FILTER" include/linux/susfs.h | head -5

          echo "=== 5.7 v13 stubs (add_sus_type / priority) ==="
          echo "" | base64 -d >> fs/susfs.c
          grep -c "susfs_add_sus_type" fs/susfs.c

          echo "=== 5.8 v18 stubs (2.3 API + rekernel) ==="
          echo "" | base64 -d >> fs/susfs.c
          grep -c "susfs_is_current_proc_no_su\|rekernel_netlink" fs/susfs.c

          echo ">>> compat done"

      - name: 6. Configure
        run: |
          set -eo pipefail
          cd $GITHUB_WORKSPACE/kernel
          export ARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          MAKEOPTS="ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make O=out $MAKEOPTS odin_defconfig < /dev/null
          wc -l out/.config

          echo "=== 下载原版内核配置（与原版内核完全一致）==="
          curl -fsSL "https://raw.githubusercontent.com/LTG6933/kernel_xiaomi_odin/lineage-24.0/odin_orig.config.gz" -o /tmp/orig.config.gz
          gunzip -c /tmp/orig.config.gz > /tmp/orig.config
          wc -l /tmp/orig.config
          echo "=== 用原版配置覆盖 ==="
          cp /tmp/orig.config out/.config
          wc -l out/.config
          echo "=== 原版规模基准 ==="
          echo -n "  原版 =y 数量: "; grep -c "^CONFIG_.*=y$" out/.config
          echo -n "  原版 =m 数量: "; grep -c "^CONFIG_.*=m$" out/.config
          CFG=./scripts/config
          F=out/.config
          $CFG --file $F --enable KSU
          $CFG --file $F --disable KSU_TRACEPOINT_HOOK
          $CFG --file $F --disable KSU_MANUAL_HOOK
          $CFG --file $F --enable KSU_SUSFS
          $CFG --file $F --enable KSU_SUSFS_SUS_PATH
          $CFG --file $F --enable KSU_SUSFS_SUS_MOUNT
          $CFG --file $F --enable KSU_SUSFS_SUS_KSTAT
          $CFG --file $F --enable KSU_SUSFS_SPOOF_UNAME
          $CFG --file $F --enable KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS
          $CFG --file $F --enable KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG
          $CFG --file $F --enable KSU_SUSFS_SUS_MAP
          $CFG --file $F --disable KSU_SUSFS_OPEN_REDIRECT
          $CFG --file $F --disable KSU_SUSFS_ENABLE_LOG
          $CFG --file $F --disable SPECULATIVE_PAGE_FAULT
          # liqidecg 的 cpuset.c 有 CS 扩展代码，需要这个开关
          # 关闭 liqidecg 源码里的小米私有框架（原版内核没有这些）
          for opt in MIHW MILLET_BINDER MILLET_BINDER_GKI MILLET_CGROUP MILLET_CORE MILLET_HS MILLET_PKG MILLET_SIG TOUCHSCREEN_COMMON F2FS_IOSTAT POLLY_CLANG DISABLE_TRACE_PRINTK; do
            $CFG --file $F --disable $opt 2>/dev/null || true
          done
          echo "=== 小米框架关闭结果 ==="
          grep -E "^CONFIG_MIHW|^CONFIG_MILLET" $F || echo "  (all off)"
          $CFG --file $F --enable CPUSET_ASSIST
          # 公开源码缺 qseecom_kernel.h，关闭 SMCINVOKE（TEE 接口，原版有但源码缺失）
          $CFG --file $F --disable QCOM_SMCINVOKE
          echo "  SMCINVOKE: $(grep '^CONFIG_QCOM_SMCINVOKE' $F || echo 'not set')"
          # liqidecg 的其他小米扩展（原版未开但代码存在）
          $CFG --file $F --enable BINDER_PRIO 2>/dev/null || true
          $CFG --file $F --enable CAM_RECLAIM 2>/dev/null || true
          $CFG --file $F --disable LOCALVERSION_AUTO
          $CFG --file $F --set-str LOCALVERSION "-qgki-odin-QiuChenly"
          $CFG --file $F --disable MODULE_SIG
          $CFG --file $F --disable MODULE_SIG_FORCE
          $CFG --file $F --disable MODULE_SIG_ALL
          make O=out $MAKEOPTS olddefconfig < /dev/null
          echo "=== 编译器检测 ==="
          grep -E "CONFIG_CC_IS_CLANG|CONFIG_CC_IS_GCC|CONFIG_LD_IS" out/.config || echo "(none)"
          if ! grep -q "^CONFIG_CC_IS_CLANG=y" out/.config; then
            echo "WARNING: NOT using clang!"
          else
            echo ">>> clang OK"
          fi
          echo "=== verify ==="
          grep -E "^CONFIG_KSU|^CONFIG_LOCALVERSION|^CONFIG_MODVERSIONS|^CONFIG_CC_IS_CLANG|SPECULATIVE" $F || true
          grep -q "^CONFIG_KSU=y" $F || { echo "FAIL KSU"; exit 1; }
          grep -q "^CONFIG_KSU_SUSFS=y" $F || { echo "FAIL SUSFS"; exit 1; }
          echo ">>> config OK"

      - name: 7. Build
        run: |
          set -o pipefail
          cd $GITHUB_WORKSPACE/kernel
          export ARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export KCFLAGS="-Wno-error=implicit-fallthrough -Wno-error=implicit-function-declaration -Wno-error=incompatible-pointer-types -Wno-error=int-conversion -Wno-error=misleading-indentation -Wno-error=address-of-packed-member"
          MAKEOPTS="ARCH=arm64 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make O=out $MAKEOPTS -j$(nproc) Image 2>&1 | tee build.log | tail -80 || true
          echo "=== result ==="
          ls -lh out/arch/arm64/boot/Image* 2>/dev/null || echo "no Image"
          stat -c "IMAGE SIZE: %s" out/arch/arm64/boot/Image 2>/dev/null || echo "IMAGE SIZE: 0"
          echo "ORIG SIZE : 40321536"
          strings out/arch/arm64/boot/Image 2>/dev/null | grep -m1 "^Linux version" || true

      - name: 8. Diagnose
        if: always()
        run: |
          cd $GITHUB_WORKSPACE/kernel
          echo "##### Image #####"
          find out -name "Image*" -type f 2>/dev/null | head || true
          echo "##### susfs.o #####"
          find out -name "susfs*.o" 2>/dev/null | head || true
          echo "##### ksu .o count #####"
          find out -path "*kernelsu*" -name "*.o" 2>/dev/null | wc -l || true
          echo "##### 所有 error: 行 #####"
          grep -nE "error:" build.log 2>/dev/null | head -25 || echo "(none)"
          echo "##### undefined reference 去重 #####"
          grep "undefined reference" build.log 2>/dev/null | sed 's/.*undefined reference to //' | sort -u | head -25 || echo "(none)"
          echo "##### tail #####"
          tail -30 build.log 2>/dev/null || true

      - name: 9. Package
        if: always()
        run: |
          cd $GITHUB_WORKSPACE
          mkdir -p dist
          cp kernel/out/arch/arm64/boot/Image dist/Image-odin 2>/dev/null || true
          cp kernel/out/.config dist/config.txt 2>/dev/null || true
          cp kernel/build.log dist/ 2>/dev/null || true
          ls -lh dist

      - name: 10. Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odin-541-bakasu
          path: dist/
          retention-days: 7
